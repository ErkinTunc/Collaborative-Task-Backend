
{% extends 'base.html' %}

{% block body %}

<div class="container py-5">
    <div class="row justify-content-center">

        <div class="col-12 col-md-7 col-lg-5">

            <div class="card shadow-sm p-4 p-md-5">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome back</h2>

                    <p class="text-muted">
                        Sign in to manage your tasks.
                    </p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username"
                               class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password"
                               class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Sign In
                    </button>

                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        Don't have an account?
                        <a href="{% url 'register' %}">
                            Create an account
                        </a>
                    </p>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
